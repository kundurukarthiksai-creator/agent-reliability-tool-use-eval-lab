name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest backend/tests -q

      - name: Run smoke test
        run: python scripts/smoke_test.py

      - name: Run evaluation report
        run: python scripts/run_eval.py

      - name: Write sample JSON report
        run: python scripts/run_eval.py reports/sample-eval-report.json

      - name: Render dashboard
        run: python scripts/render_dashboard.py

      - name: Render HTML report
        run: python scripts/render_report.py

      - name: Render failure demo
        run: python scripts/render_failure_demo.py

      - name: Render failure catalog
        run: python scripts/render_failure_catalog.py

      - name: Compare planners
        run: python scripts/compare_planners.py

      - name: Render run comparison demo
        run: python scripts/render_run_comparison_demo.py

      - name: Render run trends demo
        run: python scripts/render_run_trends_demo.py

      - name: Export schemas
        run: python scripts/export_schemas.py
